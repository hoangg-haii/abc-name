<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Speaking Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thêm thư viện SheetJS để xuất Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .custom-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        .btn-interact { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-interact:active { transform: scale(0.96); }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8 text-slate-800">

    <div class="max-w-6xl mx-auto">
        <!-- Header & API Key Input -->
        <div class="bg-white rounded-3xl p-6 mb-6 custom-shadow border border-gray-100 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600 p-3 rounded-2xl shadow-lg text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-slate-900 mb-0.5 tracking-tight uppercase">ABC Cambridge Tool</h1>
                    <div class="flex items-center gap-2">
                        <span class="bg-blue-100 px-2 py-0.5 rounded text-[10px] font-bold text-blue-700 uppercase">V4.9</span>
                        <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest text-right">Gemini 2.5 Flash Integration</p>
                    </div>
                </div>
            </div>
            <!-- API Key Input -->
            <div class="w-full md:w-auto flex flex-col gap-1">
                <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-1">Gemini API Key</label>
                <input type="password" id="uiApiKey" placeholder="Dán API Key vào đây..." class="bg-gray-50 border border-gray-200 px-4 py-2 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 outline-none w-full md:w-64 shadow-inner">
            </div>
        </div>

        <div class="grid grid-cols-1 gap-6">
            <!-- Configuration Section -->
            <div class="bg-white rounded-3xl p-6 custom-shadow border border-gray-100">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="space-y-2">
                        <label class="block text-[10px] font-black text-slate-400 uppercase ml-1 tracking-widest">Cấp độ Chương trình</label>
                        <select id="camLevel" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-bold transition-all shadow-inner">
                            <option value="Phonics Cambridge">Phonics Cambridge</option>
                            <option value="Jolly Phonics">Jolly Phonics</option>
                            <option value="Potato">Potato</option>
                            <option value="FF Starters Cambridge">FF Starters Cambridge</option>
                            <option value="FF1 Starters Cambridge">FF1 Starters Cambridge</option>
                            <option value="Movers Cambridge" selected>Mover Cambridge</option>
                            <option value="Flyers Cambridge">Flyer Cambridge</option>
                            <option value="KET Cambridge">KET Cambridge</option>
                            <option value="Starters Cambridge">Starters Cambridge</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-[10px] font-black text-slate-400 uppercase ml-1 tracking-widest">Trung tâm</label>
                        <input type="text" id="tplCenter" value="ABC 1" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-bold transition-all shadow-inner">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-[10px] font-black text-slate-400 uppercase ml-1 tracking-widest">Ngày thi</label>
                        <input type="text" id="tplDate" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-bold transition-all shadow-inner" placeholder="Mặc định: Hôm nay">
                    </div>
                </div>
            </div>

            <!-- Input and AI Scan Section -->
            <div class="bg-white rounded-3xl p-6 custom-shadow border border-gray-100">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div class="relative h-64 group" id="dropZone">
                        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleAIImage(event)">
                        <label for="imageInput" class="flex flex-col items-center justify-center w-full h-full border-2 border-dashed border-gray-200 rounded-3xl cursor-pointer bg-gray-50 hover:bg-white hover:border-blue-400 transition-all">
                            <div class="bg-blue-50 p-4 rounded-2xl mb-3 group-hover:rotate-6 transition-transform">
                                <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.587-1.587a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2H6a2 2 0 00-2 2v12a2 2 0 002-2z"></path></svg>
                            </div>
                            <span class="text-sm font-bold text-slate-700 uppercase tracking-tight">Dán (Ctrl+V) hoặc Bấm vào đây chọn file</span>
                            <span class="text-[10px] text-slate-400 mt-2 uppercase font-black tracking-tighter italic">AI Gemini sẽ tự phân tích Tên, Anh, Lớp</span>
                        </label>
                        <!-- Loading Overlay -->
                        <div id="aiLoading" class="hidden absolute inset-0 bg-white/95 rounded-3xl flex flex-col items-center justify-center z-10 border border-blue-100 shadow-xl">
                            <div class="loader mb-4"></div>
                            <span class="text-[10px] font-black text-blue-600 uppercase tracking-widest animate-pulse">Gemini đang phân tích dữ liệu...</span>
                        </div>
                    </div>

                    <div class="flex flex-col h-full">
                        <label class="block text-[10px] font-black text-slate-400 uppercase ml-1 mb-2 tracking-widest">Văn bản trích xuất (Check & Sửa tại đây)</label>
                        <textarea id="inputData" class="flex-1 w-full p-4 bg-gray-50 border border-gray-200 rounded-3xl focus:ring-2 focus:ring-blue-500 outline-none transition-all text-sm font-medium shadow-inner" placeholder="Dữ liệu mẫu sau khi quét: &#10;Nguyễn Văn An, Andy, Lớp 4&#10;Trần Thị Bình, Bella, MGN"></textarea>
                    </div>
                </div>
                
                <div class="flex flex-col sm:flex-row gap-3">
                    <button onclick="processList()" class="btn-interact flex-1 bg-slate-900 hover:bg-black text-white font-bold py-5 rounded-2xl transition-all shadow-xl flex items-center justify-center gap-3 uppercase text-xs tracking-widest">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002-2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                        Xác nhận và Xuất kết quả
                    </button>
                    <button onclick="clearData()" class="btn-interact px-8 bg-gray-100 hover:bg-gray-200 text-slate-500 font-bold py-5 rounded-2xl transition-all uppercase text-xs tracking-widest">
                        Xóa dữ liệu
                    </button>
                </div>
            </div>

            <!-- Result Display Section -->
            <div id="resultSection" class="hidden space-y-6 pb-20 animate-in fade-in duration-500">
                <!-- Search and Export Toolbar -->
                <div class="flex flex-col md:flex-row items-center gap-4">
                    <div class="flex-1 flex flex-col sm:flex-row items-center bg-white rounded-2xl p-4 custom-shadow border border-gray-100 gap-4 w-full">
                        <div class="flex items-center gap-3 w-full sm:w-auto flex-1">
                            <div class="bg-gray-100 p-2 rounded-xl text-slate-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            </div>
                            <input type="text" id="nameSearch" onkeyup="filterResults()" placeholder="Tìm kiếm theo Tên Tiếng Anh (A - Z)..." class="flex-1 bg-transparent border-none outline-none text-sm font-bold text-slate-700 placeholder:text-slate-300">
                        </div>
                        <div class="flex items-center gap-3 shrink-0">
                            <label class="flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-500">
                                <input type="checkbox" id="toggleShowRead" onchange="filterResults()" class="rounded text-blue-600 focus:ring-blue-500">
                                <span>Hiện cả tên đã chép</span>
                            </label>
                            <div id="searchCount" class="text-[10px] font-black text-blue-600 bg-blue-50 px-3 py-1 rounded-full uppercase tracking-tighter">0 kết quả</div>
                        </div>
                    </div>
                    
                    <button onclick="exportToExcel()" class="btn-interact bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 px-8 rounded-2xl transition-all shadow-xl flex items-center justify-center gap-3 uppercase text-[10px] tracking-widest whitespace-nowrap w-full md:w-auto">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        Xuất file Excel
                    </button>
                </div>

                <div class="table-container bg-white rounded-3xl custom-shadow border border-gray-100 overflow-hidden">
                    <table class="w-full text-left text-sm border-collapse" id="resultTable">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-100">
                                <th class="p-5 font-black text-slate-400 w-[15%] text-center uppercase text-[9px] tracking-widest">Tên Anh (A-Z)</th>
                                <th class="p-5 font-black text-slate-400 w-[30%] text-center uppercase text-[9px] tracking-widest">Tiêu đề (Title)</th>
                                <th class="p-5 font-black text-slate-400 w-[55%] text-center uppercase text-[9px] tracking-widest">Mô tả (Bio)</th>
                            </tr>
                        </thead>
                        <tbody id="resultBody" class="divide-y divide-gray-50"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest opacity-0 translate-y-10 transition-all pointer-events-none shadow-2xl z-50">
        Copy thành công!
    </div>

    <script>
        const apiKey = ""; // API Key fallback

        // --- CLIPBOARD PASTE & FILE HANDLING & GEMINI VISION INTEGRATION ---
        
        // Listen for Ctrl+V paste events anywhere on the window
        window.addEventListener('paste', (e) => {
            const items = e.clipboardData?.items;
            if (!items) return;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    const file = items[i].getAsFile();
                    if (file) {
                        processImageWithGemini(file);
                        break;
                    }
                }
            }
        });

        // Handle file select from file input
        function handleAIImage(event) {
            const file = event.target.files && event.target.files[0];
            if (file) {
                processImageWithGemini(file);
            }
        }

        // Handle Drag and Drop
        document.addEventListener('DOMContentLoaded', () => {
            const dropZone = document.getElementById('dropZone');
            if (!dropZone) return;

            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                }, false);
            });

            dropZone.addEventListener('drop', (e) => {
                const dt = e.dataTransfer;
                const files = dt.files;
                if (files && files.length > 0 && files[0].type.startsWith('image/')) {
                    processImageWithGemini(files[0]);
                }
            });
        });

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        async function processImageWithGemini(file) {
            const key = document.getElementById('uiApiKey')?.value.trim() || apiKey;
            const loading = document.getElementById('aiLoading');
            if (loading) loading.classList.remove('hidden');

            try {
                const base64Data = await fileToBase64(file);
                const mimeType = file.type || 'image/png';
                const base64Clean = base64Data.split(',')[1];

                const prompt = "Hãy phân tích danh sách học sinh trong ảnh. Trích xuất danh sách thành từng dòng với định dạng chuẩn: [Họ và Tên], [Tên Tiếng Anh], [Lớp/Khối]. Ví dụ:\nNguyễn Văn An, Andy, Lớp 4\nTrần Thị Bình, Bella, MGN\nChỉ trả về văn bản dạng các dòng dữ liệu, không kèm câu giải thích hay trang trí markdown code block.";

                const payload = {
                    contents: [{
                        role: "user",
                        parts: [
                            { text: prompt },
                            {
                                inlineData: {
                                    mimeType: mimeType,
                                    data: base64Clean
                                }
                            }
                        ]
                    }]
                };

                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${key}`;
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                const textResult = data.candidates?.[0]?.content?.parts?.[0]?.text;

                if (textResult) {
                    document.getElementById('inputData').value = textResult.trim();
                    showToast("Đã phân tích ảnh thành công!");
                } else {
                    showToast("Không thể đọc được ảnh hoặc API Key chưa đúng.");
                }
            } catch (err) {
                console.error("Gemini Vision error:", err);
                showToast("Lỗi xử lý ảnh với Gemini!");
            } finally {
                if (loading) loading.classList.add('hidden');
                // Reset file input value so user can re-upload same file if needed
                const imgInput = document.getElementById('imageInput');
                if (imgInput) imgInput.value = '';
            }
        }

        /**
         * Chuyển đổi thông tin lớp sang tuổi tương ứng:
         * MGN = 3 tuổi, MGL = 5 tuổi, Lớp 1-5 = Lớp + 5 tuổi (Lớp 4 = 9 tuổi)
         */
        function convertClassToAge(classInfo) {
            if (!classInfo) return "";
            const c = classInfo.toUpperCase().replace(/\s+/g, '');
            
            if (c.includes('MGN')) return "3 tuổi";
            if (c.includes('MGL')) return "5 tuổi";
            
            const match = c.match(/\d+/);
            if (match) {
                const grade = parseInt(match[0]);
                if (grade >= 1 && grade <= 12) {
                    return (grade + 5) + " tuổi";
                }
            }
            return classInfo;
        }

        function filterResults() {
            const query = document.getElementById('nameSearch').value.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            const showRead = document.getElementById('toggleShowRead')?.checked || false;
            let visibleCount = 0;

            currentProcessedItems.forEach((item, index) => {
                const row = document.getElementById(`row-${index}`);
                if (!row) return;

                // Search ONLY by English Name
                const engNameNorm = (item.tenAnh || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                const matchesSearch = engNameNorm.includes(query);

                // Exclude read items when searching unless "showRead" is enabled
                const isHiddenByRead = item.isRead && !showRead && query !== "";

                if (matchesSearch && !isHiddenByRead) {
                    row.style.display = "";
                    visibleCount++;
                } else {
                    row.style.display = "none";
                }
            });
            
            document.getElementById('searchCount').innerText = `${visibleCount} kết quả`;
        }

        // State to store current items for Excel export and read status
        let currentProcessedItems = [];

        function processList() {
            const input = document.getElementById('inputData').value;
            const camLevel = document.getElementById('camLevel').value;
            const center = document.getElementById('tplCenter').value;
            const date = document.getElementById('tplDate').value || new Date().toLocaleDateString('vi-VN');
            const tbody = document.getElementById('resultBody');
            
            tbody.innerHTML = '';
            currentProcessedItems = [];
            const lines = input.split('\n');
            let rawItems = [];

            lines.forEach(line => {
                if (!line.trim()) return;
                const parts = line.split(/[,;|/\t]+/).map(p => p.trim());
                if (parts.length < 2) return;

                const hoTen = parts[0];
                const tenAnh = parts[1];
                const lopRaw = parts[2] || "";
                
                // Chuyển đổi Lớp sang Tuổi cho Bio
                const ageInfo = convertClassToAge(lopRaw);
                
                // Ghép họ và tên (TA + TV): VD "Andy Nguyễn Văn An"
                const fullNameTATV = tenAnh ? `${tenAnh} ${hoTen}` : hoTen;

                // Định dạng Title
                const title = lopRaw 
                    ? `Speaking test - ${lopRaw} - ${fullNameTATV} - ${camLevel}`
                    : `Speaking test - ${fullNameTATV} - ${camLevel}`;

                const bio = `${hoTen} - ${tenAnh} - ${ageInfo} - Test ${date}\n\nContact for work: Anh ngữ ABC Hội An\nEmail: abcenglishcenter@gmail.com\nHotline: 0393 62 1362\nFacebook: Anh Ngữ ABC Hội An\nAddress: 1362 Trần Thủ Độ, Điện Bàn Đông, Quảng Nam`;

                rawItems.push({
                    hoTen,
                    tenAnh,
                    lopRaw,
                    title,
                    bio,
                    isRead: false
                });
            });

            if (rawItems.length === 0) return;

            // Sort A - Z by English Name (tenAnh)
            rawItems.sort((a, b) => a.tenAnh.localeCompare(b.tenAnh, 'en', { sensitivity: 'base' }));
            currentProcessedItems = rawItems;

            currentProcessedItems.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.id = `row-${index}`;
                tr.className = "hover:bg-blue-50/50 transition-all group";
                tr.innerHTML = `
                    <td class="p-6 text-center">
                        <span class="inline-block bg-white border border-blue-100 text-blue-600 font-black px-4 py-2 rounded-xl text-xs shadow-sm mb-2">${item.tenAnh}</span>
                        <div>
                            <span id="status-${index}" class="inline-block bg-slate-100 text-slate-400 font-bold px-2 py-0.5 rounded text-[8px] uppercase">Chưa đọc</span>
                        </div>
                    </td>
                    <td class="p-6">
                        <div class="bg-white border border-gray-100 p-4 rounded-2xl font-bold text-slate-700 text-center text-[11px] mb-3 shadow-sm group-hover:border-blue-200 transition-colors">${item.title}</div>
                        <button onclick="copyTitle(this, \`${item.title}\`, ${index})" class="btn-interact w-full bg-slate-900 text-white text-[9px] font-black py-3 rounded-xl hover:bg-blue-600 uppercase tracking-widest shadow-lg">Copy Title</button>
                    </td>
                    <td class="p-6">
                        <div class="bg-gray-50 border border-gray-100 p-4 rounded-2xl whitespace-pre-wrap text-slate-500 text-[10px] mb-3 group-hover:bg-white transition-colors leading-relaxed">${item.bio}</div>
                        <button onclick="copyBio(this, \`${item.bio}\`, ${index})" class="btn-interact w-full bg-white text-blue-600 border border-blue-200 text-[9px] font-black py-3 rounded-xl hover:bg-blue-50 uppercase tracking-widest shadow-sm">Copy Bio & Đánh Dấu</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('resultSection').classList.remove('hidden');
            document.getElementById('nameSearch').value = '';
            filterResults();
            document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
        }

        function markAsRead(index) {
            if (index !== undefined && currentProcessedItems[index]) {
                currentProcessedItems[index].isRead = true;
                const row = document.getElementById(`row-${index}`);
                if (row) {
                    row.classList.add('bg-slate-50', 'opacity-50');
                }
                const statusBadge = document.getElementById(`status-${index}`);
                if (statusBadge) {
                    statusBadge.innerText = 'ĐÃ CHÉP';
                    statusBadge.className = 'inline-block bg-emerald-100 text-emerald-700 font-bold px-2 py-0.5 rounded text-[8px] uppercase';
                }
            }
        }

        function copyTitle(btn, text, index) {
            copyTextToClipboard(text);
            showToast("Đã copy Title!");
            const originalText = btn.innerText;
            btn.innerText = 'ĐÃ COPY!';
            setTimeout(() => { btn.innerText = originalText; }, 800);
        }

        function copyBio(btn, text, index) {
            copyTextToClipboard(text);
            markAsRead(index);
            showToast("Đã copy Bio & Đánh dấu đã đọc!");
            
            const originalText = btn.innerText;
            btn.innerText = 'ĐÃ CHÉP & ĐỌC!';
            setTimeout(() => { btn.innerText = originalText; }, 800);

            // Re-filter so read items are automatically hidden from active search results
            filterResults();
        }

        function copyTextToClipboard(text) {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg || "Copy thành công!";
            toast.classList.remove('opacity-0', 'translate-y-10');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-10'); }, 1500);
        }

        function exportToExcel() {
            if (currentProcessedItems.length === 0) {
                alert("Không có dữ liệu để xuất!");
                return;
            }

            const dataForExcel = currentProcessedItems.map(item => ({
                "Tên tiếng Anh": item.tenAnh,
                "Title": item.title,
                "Bio": item.bio,
                "Trạng thái": item.isRead ? "Đã chép" : "Chưa chép"
            }));

            const ws = XLSX.utils.json_to_sheet(dataForExcel);
            const wscols = [{wch: 20}, {wch: 50}, {wch: 80}, {wch: 15}];
            ws['!cols'] = wscols;

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Danh_sach_Speaking");

            const level = document.getElementById('camLevel').value;
            const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, "");
            const filename = `ABC_Speaking_${level}_${dateStr}.xlsx`;

            XLSX.writeFile(wb, filename);
        }

        function clearData() {
            if(confirm("Xóa toàn bộ dữ liệu hiện tại?")) {
                document.getElementById('inputData').value = '';
                document.getElementById('resultSection').classList.add('hidden');
                document.getElementById('nameSearch').value = '';
                currentProcessedItems = [];
            }
        }
    </script>
</body>
